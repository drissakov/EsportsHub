<form id="greeting-form" class="sidebar-greeting" novalidate>
    <label for="greeting-name" class="form-label">Your nickname</label>
    <input type="text" id="greeting-name" name="nickname" class="form-control"
        autocomplete="nickname" aria-required="true" aria-describedby="greeting-error">
    <p id="greeting-error" class="field-error" role="status"></p>
    <button type="submit" class="btn btn-outline-primary mt-2">Apply</button>
    <button type="reset" class="btn btn-outline-secondary mt-2">Reset</button>
    <p class="mt-2" id="greeting-message" role="status">Welcome, player!</p>
</form>
