<details class="hub-tools" id="page-tools">
    <summary>Page tools</summary>
    <div class="hub-tools-content">
        <small>Local time</small>
        <time class="hub-clock" data-current-time>Loading time…</time>
        <div class="hub-tool-actions">
            <button class="btn btn-outline-primary" data-background-cycle type="button">Change background</button>
            <p class="background-status" role="status">Background: <span data-background-name>White</span></p>
            <button class="btn btn-outline-primary" data-open-subscription type="button">Try subscription</button>
        </div>
        <noscript><p>Enable JavaScript to use the page tools.</p></noscript>
{{nickname}}
    </div>
</details>
